server:
  port: ${PORT:8080}

spring:
  # Railway 默认走 prod；本地开发再设 SPRING_PROFILES_ACTIVE=local
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

scheduling:
  defaults:
    open-time: "08:30"
    close-time: "23:30"
    need-per-slot: 2
    work-hours: 8.0
    break-hours: 1.5
    max-days-per-week: 5
    max-hours-per-day: 12
    lunch-start: "10:30"
    lunch-end: "13:30"
    lunch-need: 4
    dinner-start: "16:30"
    dinner-end: "19:30"
    dinner-need: 4

---
# 仅本地：SPRING_PROFILES_ACTIVE=local
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/scheduling;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
