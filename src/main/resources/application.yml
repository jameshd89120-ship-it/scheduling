server:
  port: ${PORT:8080}

spring:
  datasource:
    # 使用环境变量，注意这里要写 JDBC 格式的 URL，Railway 会自动注入
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver # ① 驱动类名改为 PG 的
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect # ② 方言改为 PG 的
    open-in-view: false
#注意这里
scheduling:
  defaults:
    open-time: "08:30"
    close-time: "23:30"
    need-per-slot: 2
    work-hours: 8.0
    break-hours: 1.5
    max-days-per-week: 5
    max-hours-per-day: 120
    # 🚨 新增餐期配置
    lunch-start: "10:30"
    lunch-end: "13:30"
    lunch-need: 4
    dinner-start: "16:30"
    dinner-end: "19:30"
    dinner-need: 4